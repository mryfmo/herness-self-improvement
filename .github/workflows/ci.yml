name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check relocated documents
        run: |
          test -f docs/plans/WORKPLAN-HARNESS-SELF-IMPROVEMENT-v1.0.md
          test -f docs/plans/WORKPLAN-HARNESS-SELF-IMPROVEMENT-v1.1.md
          test -f docs/specs/SPEC-HARNESS-SELF-IMPROVEMENT-v1.0.md
          test -f docs/reference/REPORT-HARNESS-SELF-IMPROVEMENT-v1.0.md
          test -f docs/decisions/ADR-HARNESS-SELF-IMPROVEMENT-v1.0.md
      - name: Check repository skeleton
        run: |
          test -d docs/decisions
          test -d docs/plans
          test -d docs/specs
          test -d docs/reference
          test -d docs/lessons
          test -d .claude/skills
          test -d .claude/agents
          test -d .claude/hooks
          test -d .claude/commands
          test -d ci
      - name: Test rules generator
        run: python3 ci/test_generate_rules.py
      - name: Check generated rules
        run: |
          python3 ci/generate-rules.py
          git diff --exit-code -- CLAUDE.md AGENTS.md
      - name: Test telemetry migrations
        run: ci/test_migrations.sh
      - name: Test task ledger
        run: ci/test_task_ledger.sh
      - name: Smoke-test SQLite load
        run: ci/test_sqlite_load.sh
      - name: Test evidence and gates
        run: ci/test_evidence_gates.sh
      - name: Verify frozen paths
        run: ci/hash-freeze.py verify
      - name: Scan secrets
        run: ci/secret-scan.py
